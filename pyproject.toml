[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriruntime"
version = "0.1.0"
description = "Declarative multi-verifier execution runtime"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21,<5", "psutil>=5.9,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
vrun = "veriruntime.cli:main"

[tool.setuptools.packages.find]
include = ["veriruntime*"]

[tool.setuptools.package-data]
"veriruntime.dsl" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs installed real software verifiers"]
